<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Stage Chatbot - PhD Study</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px 30px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-header {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #495057;
        }
        
        .message-content {
            padding: 12px 15px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            margin-left: 60px;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #212529;
            margin-right: 60px;
            border: 1px solid #dee2e6;
        }
        
        .message.system .message-content {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-style: italic;
            border: 1px solid #ffc107;
        }
        
        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #e9ecef;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        #userInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }
        
        .btn-reset {
            background: #6c757d;
        }
        
        .btn-reset:hover {
            background: #5a6268;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            color: #6c757d;
            font-style: italic;
        }
        
        .loading.active {
            display: block;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Research Assistant</h1>
            <p>Your intelligent conversation partner</p>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message system">
                <div class="message-content">
                    안녕하세요! 궁금하신 점을 물어보세요. 함께 답을 찾아가겠습니다.
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">🔄 Processing...</div>
            
            <div class="input-group" id="queryInput">
                <input type="text" id="userInput" placeholder="궁금한 것을 입력하세요..." />
                <button onclick="sendMessage()">Send</button>
                <button class="btn-reset" onclick="resetChat()">Reset</button>
            </div>
        </div>
    </div>
    
    <script>
        let conversationId = null;
        
        function addMessage(role, content, isSystem = false) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSystem ? 'system' : role}`;
            
            let header = '';
            if (!isSystem) {
                header = role === 'user' ? 'You' : 'Assistant';
            }
            
            messageDiv.innerHTML = `
                ${header ? `<div class="message-header">${header}</div>` : ''}
                <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function setLoading(isLoading) {
            const loading = document.getElementById('loading');
            const input = document.getElementById('userInput');
            const sendBtn = document.querySelector('button[onclick="sendMessage()"]');
            
            if (isLoading) {
                loading.classList.add('active');
                input.disabled = true;
                sendBtn.disabled = true;
            } else {
                loading.classList.remove('active');
                input.disabled = false;
                sendBtn.disabled = false;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) {
                showError('메시지를 입력해주세요');
                return;
            }
            
            addMessage('user', message);
            input.value = '';
            setLoading(true);
            
            try {
                const endpoint = conversationId ? '/api/chat' : '/api/start';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        conversation_id: conversationId 
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    setLoading(false);
                    return;
                }
                
                if (!conversationId) {
                    conversationId = data.conversation_id;
                }
                
                addMessage('assistant', data.response);
                setLoading(false);
                
            } catch (error) {
                showError('Error: ' + error.message);
                setLoading(false);
            }
        }
        
        async function resetChat() {
            try {
                await fetch('/api/reset', { method: 'POST' });
                location.reload();
            } catch (error) {
                showError('Error resetting: ' + error.message);
            }
        }
        
        // Allow Enter key to send message
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
