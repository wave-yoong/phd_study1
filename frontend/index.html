<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 웰니스 에이전트 - PhD Study</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 100%;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            background: #ffffff;
            color: #202123;
            padding: 12px 16px;
            border-bottom: 1px solid #ececf1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        
        .header p {
            font-size: 12px;
            color: #8e8ea0;
            margin: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        .brand-logo svg {
            display: block;
            border-radius: 9px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #202123;
            letter-spacing: -0.2px;
        }

        .scenario-start {
            margin-top: 14px;
        }

        .start-btn {
            background: #10a37f;
            color: #ffffff;
            border: 1px solid #0d8c6d;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .start-btn:hover {
            background: #0d8c6d;
            border-color: #0d8c6d;
            color: #ffffff;
        }
        
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-header {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #202123;
        }
        
        .message-content {
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .message.user .message-content {
            background: #f7f7f8;
            color: #202123;
            border: none;
        }
        
        .message.assistant .message-content {
            background: #ffffff;
            color: #202123;
            border: none;
        }

        .message-content strong {
            font-weight: 700;
            color: #202123;
        }

        .scenario-box {
            background: #f0f7f4;
            border: 1px solid #cfe8df;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #1f3d34;
            text-align: left;
        }

        .scenario-box .scenario-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .agent-actions {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .agent-action {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f7ff;
            border: 1px solid #e2e8ff;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #33415c;
        }

        .agent-action .action-icon {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: #6366f1;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .agent-action .action-tool {
            font-weight: 600;
        }

        .agent-action .action-status {
            margin-left: auto;
            color: #16a34a;
            font-size: 12px;
        }

        .choice-panel {
            margin-top: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
        }

        .choice-item {
            width: 100%;
            border: none;
            border-top: 1px solid #f1f2f4;
            background: #ffffff;
            color: #202123;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-start;
            border-radius: 0;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
        }

        .choice-item:first-child {
            border-top: none;
        }

        .choice-item:hover {
            background: #f7f7f8;
            border-color: #f1f2f4;
        }

        .choice-item.selected {
            background: #eef8f5;
        }

        .choice-item.selected .choice-index {
            background: #10a37f;
            color: #ffffff;
        }

        .choice-item:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #fafafa;
            color: #6e6e80;
        }

        .choice-index {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: #f3f4f6;
            color: #4b5563;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .choice-label {
            flex: 1;
        }

        .choice-input-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #8e8ea0;
        }

        .choice-actions {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
        }

        .choice-submit {
            padding: 8px 12px;
            font-size: 13px;
            background: #10a37f;
            color: #ffffff;
            border: 1px solid #0d8c6d;
        }

        .choice-submit:hover {
            background: #0d8c6d;
            border-color: #0d8c6d;
            color: #ffffff;
        }
        
        .message-content a {
            color: #10a37f;
            text-decoration: underline;
            word-break: break-all;
        }
        
        .message-content a:hover {
            color: #0d8c6d;
        }
        
        .message.system .message-content {
            background: #f7f7f8;
            color: #6e6e80;
            text-align: center;
            font-style: normal;
            border: none;
            font-size: 14px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ececf1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            max-width: 100%;
            background: #f7f7f8;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid #d1d5db;
        }
        
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            color: #202123;
        }
        
        #userInput:focus {
            outline: none;
        }
        
        #userInput::placeholder {
            color: #8e8ea0;
        }
        
        button {
            padding: 10px 20px;
            background: #ffffff;
            color: #202123;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button:hover {
            background: #f7f7f8;
            border-color: #202123;
        }
        
        button:disabled {
            background: #f7f7f8;
            cursor: not-allowed;
            color: #d1d5db;
            border-color: #d1d5db;
        }
        
        .send-btn {
            padding: 8px 12px;
            background: #ffffff;
            color: #202123;
            border: 1px solid #d1d5db;
        }
        
        .send-btn:hover {
            color: #10a37f;
            border-color: #10a37f;
        }
        
        .send-btn:disabled {
            color: #d1d5db;
        }
        
        .btn-reset {
            background: #ffffff;
            color: #202123;
            border: 1px solid #d1d5db;
        }
        
        .btn-reset:hover {
            background: #f7f7f8;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 12px;
            color: #8e8ea0;
            font-style: normal;
            font-size: 14px;
        }
        
        .loading.active {
            display: block;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #fcc;
            display: none;
            font-size: 14px;
        }
        
        .error-message.active {
            display: block;
        }

        /* ---- Agent tool steps (animated working -> done) ---- */
        .agent-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .agent-step {
            border: 1px solid #e6e8f0;
            border-radius: 12px;
            overflow: hidden;
            background: #fbfcff;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .agent-step.show {
            opacity: 1;
            transform: translateY(0);
        }

        .agent-step-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 13px;
        }

        .agent-step-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #eef2ff;
            color: #4f46e5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .agent-step.done .agent-step-icon {
            background: #e7f7f0;
            color: #0d8c6d;
        }

        .agent-step-label {
            font-weight: 600;
            font-size: 14px;
            color: #1f2937;
        }

        .agent-step-status {
            margin-left: auto;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
        }

        .agent-step.done .agent-step-status {
            color: #16a34a;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #c7d2fe;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .agent-step-body {
            padding: 0 14px;
            max-height: 0;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.6;
            color: #2b2f36;
            border-top: 1px solid transparent;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .agent-step.reveal .agent-step-body {
            max-height: 1600px;
            padding: 12px 14px;
            border-top: 1px solid #eef0f6;
        }

        .approval-prompt {
            margin: 8px 0 2px;
            padding: 12px 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #9a3412;
        }

        /* ---- Day / time availability widget ---- */
        .day-time-widget {
            margin-top: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 6px 4px;
            background: #fff;
        }

        .dt-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-top: 1px solid #f1f2f4;
        }

        .dt-row:first-child { border-top: none; }

        .dt-day {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-weight: 700;
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dt-day.active {
            background: #10a37f;
            border-color: #0d8c6d;
            color: #fff;
        }

        .dt-slots {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .dt-slot {
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background: #fff;
            font-size: 13px;
            color: #9ca3af;
            cursor: pointer;
        }

        .dt-row.active .dt-slot { color: #374151; }

        .dt-slot.active {
            background: #eef8f5;
            border-color: #10a37f;
            color: #0d8c6d;
            font-weight: 600;
        }

        .dt-actions {
            display: flex;
            justify-content: flex-end;
            padding: 10px;
        }

        .dt-submit {
            padding: 9px 16px;
            background: #10a37f;
            color: #fff;
            border: 1px solid #0d8c6d;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .dt-submit:hover { background: #0d8c6d; color: #fff; }
        .dt-hint { padding: 0 12px 6px; font-size: 12px; color: #8e8ea0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <span class="brand-logo" aria-label="AI Diet Planner logo">
                    <svg width="34" height="34" viewBox="0 0 32 32" role="img" aria-hidden="true">
                        <defs>
                            <linearGradient id="dpg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#13b88c"/>
                                <stop offset="1" stop-color="#0c7a5e"/>
                            </linearGradient>
                        </defs>
                        <rect width="32" height="32" rx="9" fill="url(#dpg)"/>
                        <path d="M16 6.5c4.6 1.2 7 4.7 7 9 0 4.6-3 8-7 10-4-2-7-5.4-7-10 0-4.3 2.4-7.8 7-9z" fill="#ffffff" opacity="0.95"/>
                        <path d="M11 16.4h2.1l1.3-2.7 1.9 5 1.3-2.5H21" fill="none" stroke="#0c7a5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="brand-name">AI Wellness Agent</span>
                </span>
            </div>
            <button class="btn-reset" onclick="resetChat()">New Chat</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message system">
                <div class="message-content">
                    <div class="scenario-box">
                        <div class="scenario-title">시나리오 (실험 참가자 전용)</div>
                        당신은 앞으로 2주간 더 건강한 생활 루틴을 만들고 싶어 합니다.
                        당신의 AI 웰니스 에이전트는 식단·운동·수면과 일상 습관을 포함한 2주 루틴을 대신 설계해 줍니다.
                        체중 감량 같은 특정 목표가 있다면 선택적으로 반영할 수 있습니다.
                        AI 에이전트와 대화하면서 2주간의 건강 루틴을 함께 계획해 주세요.
                        <div class="scenario-start">
                            <button type="button" class="start-btn" onclick="startPlanning()">AI 에이전트와 루틴 설계 시작하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">Thinking...</div>
            
            <div class="input-group" id="queryInput">
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." />
                <button onclick="sendMessage()" class="send-btn" title="전송" id="sendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let conversationId = null;

        // Experimental condition can be set via ?group=control or ?group=auto.
        const urlParams = new URLSearchParams(window.location.search);
        const assignedGroup = urlParams.get('group') || '';

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        const delay = (ms) => new Promise(r => setTimeout(r, ms));

        // Inline SVG icons for each simulated agent tool.
        function iconSvg(name) {
            const P = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
            const icons = {
                calc: `<rect x="5" y="3" width="14" height="18" rx="2" ${P}/><line x1="9" y1="7" x2="15" y2="7" ${P}/><line x1="9" y1="11" x2="9" y2="11" ${P}/><line x1="12" y1="11" x2="12" y2="11" ${P}/><line x1="15" y1="11" x2="15" y2="11" ${P}/><line x1="9" y1="15" x2="9" y2="15" ${P}/><line x1="12" y1="15" x2="12" y2="15" ${P}/>`,
                meal: `<path d="M6 3v8a2 2 0 0 0 4 0V3M8 3v18" ${P}/><path d="M16 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4 2.5-1 2.5-4-1-5-2.5-5zM16 12v9" ${P}/>`,
                workout: `<path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11" ${P}/>`,
                calendar: `<rect x="4" y="5" width="16" height="16" rx="2" ${P}/><line x1="4" y1="9" x2="20" y2="9" ${P}/><line x1="8" y1="3" x2="8" y2="6" ${P}/><line x1="16" y1="3" x2="16" y2="6" ${P}/>`,
                grocery: `<circle cx="9" cy="20" r="1.3" ${P}/><circle cx="17" cy="20" r="1.3" ${P}/><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6" ${P}/>`,
                plan: `<path d="M9 4h6a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v0a1 1 0 0 1 1-1z" ${P}/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" ${P}/><path d="M8.5 13l2 2 4-4" ${P}/>`,
                sleep: `<path d="M20 14.5A8 8 0 1 1 9.5 4 6.2 6.2 0 0 0 20 14.5z" ${P}/>`,
            };
            return `<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.plan}</svg>`;
        }

        const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        // Reveal one tool step: spinner ("실행 중") -> check ("완료") -> body fades in.
        async function animateStep(container, step) {
            const card = document.createElement('div');
            card.className = 'agent-step';
            card.innerHTML = `
                <div class="agent-step-head">
                    <span class="agent-step-icon">${iconSvg(step.icon)}</span>
                    <span class="agent-step-label">${escapeHtml(step.label || '도구')}</span>
                    <span class="agent-step-status"><span class="spinner"></span>실행 중...</span>
                </div>
                <div class="agent-step-body">${convertLinksToClickable(escapeHtml(step.content || '').replace(/\n/g, '<br>'))}</div>
            `;
            container.appendChild(card);
            scrollToBottom();
            requestAnimationFrame(() => card.classList.add('show'));
            await delay(850);
            card.classList.add('done');
            card.querySelector('.agent-step-status').innerHTML = `${CHECK_SVG} 완료`;
            await delay(120);
            card.classList.add('reveal');
            scrollToBottom();
            await delay(420);
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function renderAgentActions(actions) {
            if (!Array.isArray(actions) || actions.length === 0) {
                return '';
            }
            const items = actions.map(a => `
                <div class="agent-action">
                    <span class="action-icon">&#9881;</span>
                    <span class="action-tool">${escapeHtml(a.label || a.tool || '도구')}</span>
                    <span class="action-status">${escapeHtml(a.status || '실행 완료')}</span>
                </div>
            `).join('');
            return `<div class="agent-actions">${items}</div>`;
        }

        function convertLinksToClickable(text) {
            // **text** 형식을 <strong>text</strong>로 변환 (먼저 처리)
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // URL을 클릭 가능한 링크로 변환
            const urlPattern = /(https?:\/\/[^\s<]+[^<.,;:!?\s)])/g;
            text = text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color: #10a37f; text-decoration: underline;">$1</a>');
            
            return text;
        }

        function disableAllChoiceButtons() {
            document.querySelectorAll('.choice-item, .choice-submit').forEach(button => {
                button.disabled = true;
            });
        }

        function renderChoices(container, choices) {
            if (!Array.isArray(choices) || choices.length === 0) {
                return;
            }

            const numberedChoices = choices.filter(choice => /^\d+$/.test(String(choice.id || '')));
            const hasCustomInputChoice = choices.some(choice => !((choice.value || '').trim()));
            const isMultiSelect = numberedChoices.length >= 2 && hasCustomInputChoice;
            const selectedNumberIds = new Set();

            const panel = document.createElement('div');
            panel.className = 'choice-panel';

            choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-item';
                button.type = 'button';
                button.innerHTML = `
                    <span class="choice-index">${choice.id && /^\d+$/.test(choice.id) ? choice.id : (index + 1)}</span>
                    <span class="choice-label">${choice.label || ''}</span>
                `;

                button.addEventListener('click', () => {
                    if (button.disabled) return;

                    if (isMultiSelect && /^\d+$/.test(String(choice.id || ''))) {
                        const id = String(choice.id);
                        if (selectedNumberIds.has(id)) {
                            selectedNumberIds.delete(id);
                            button.classList.remove('selected');
                        } else {
                            selectedNumberIds.add(id);
                            button.classList.add('selected');
                        }
                        return;
                    }

                    const value = (choice.value || '').trim();
                    if (!value) {
                        const input = document.getElementById('userInput');
                        input.focus();
                        return;
                    }

                    const input = document.getElementById('userInput');
                    input.value = value;
                    sendMessage();
                });

                panel.appendChild(button);
            });

            container.appendChild(panel);

            if (isMultiSelect) {
                const actions = document.createElement('div');
                actions.className = 'choice-actions';

                const submitBtn = document.createElement('button');
                submitBtn.type = 'button';
                submitBtn.className = 'choice-submit';
                submitBtn.textContent = '선택 완료';

                submitBtn.addEventListener('click', () => {
                    if (submitBtn.disabled) return;

                    if (selectedNumberIds.size === 0) {
                        showError('하나 이상 선택해주세요');
                        return;
                    }

                    const selected = Array.from(selectedNumberIds)
                        .map(v => Number(v))
                        .sort((a, b) => a - b)
                        .map(v => `${v}번`)
                        .join(', ');

                    const input = document.getElementById('userInput');
                    input.value = `${selected} 자료로 진행해줘`;
                    sendMessage();
                });

                actions.appendChild(submitBtn);
                container.appendChild(actions);
            }

            const hasCustomInput = hasCustomInputChoice;
            if (hasCustomInput) {
                const hint = document.createElement('div');
                hint.className = 'choice-input-hint';
                hint.textContent = isMultiSelect
                    ? '번호 옵션은 여러 개 선택 후 선택 완료를 눌러주세요. 기타는 직접 입력할 수 있어요.'
                    : '기타를 선택하면 직접 입력할 수 있어요.';
                container.appendChild(hint);
            }
        }

        // Interactive day x time-slot availability picker.
        function renderDayTimeWidget(container, widget) {
            const days = widget.days || ['월', '화', '수', '목', '금', '토', '일'];
            const slots = widget.slots || ['오전', '오후', '저녁'];
            const selected = {}; // day -> Set(slots)

            const panel = document.createElement('div');
            panel.className = 'day-time-widget';

            days.forEach(day => {
                const row = document.createElement('div');
                row.className = 'dt-row';

                const dayBtn = document.createElement('button');
                dayBtn.type = 'button';
                dayBtn.className = 'dt-day';
                dayBtn.textContent = day;

                const slotsWrap = document.createElement('div');
                slotsWrap.className = 'dt-slots';

                const syncDay = () => {
                    const has = selected[day] && selected[day].size > 0;
                    dayBtn.classList.toggle('active', !!has);
                    row.classList.toggle('active', !!has);
                };

                slots.forEach(slot => {
                    const sBtn = document.createElement('button');
                    sBtn.type = 'button';
                    sBtn.className = 'dt-slot';
                    sBtn.textContent = slot;
                    sBtn.addEventListener('click', () => {
                        if (sBtn.disabled) return;
                        if (!selected[day]) selected[day] = new Set();
                        if (selected[day].has(slot)) {
                            selected[day].delete(slot);
                            sBtn.classList.remove('active');
                        } else {
                            selected[day].add(slot);
                            sBtn.classList.add('active');
                        }
                        syncDay();
                    });
                    slotsWrap.appendChild(sBtn);
                });

                // Tapping the day toggles all slots on/off quickly.
                dayBtn.addEventListener('click', () => {
                    const has = selected[day] && selected[day].size > 0;
                    if (has) {
                        selected[day].clear();
                        slotsWrap.querySelectorAll('.dt-slot').forEach(b => b.classList.remove('active'));
                    } else {
                        selected[day] = new Set(slots);
                        slotsWrap.querySelectorAll('.dt-slot').forEach(b => b.classList.add('active'));
                    }
                    syncDay();
                });

                row.appendChild(dayBtn);
                row.appendChild(slotsWrap);
                panel.appendChild(row);
            });

            const hint = document.createElement('div');
            hint.className = 'dt-hint';
            hint.textContent = '가능한 요일과 각 요일의 시간대를 선택한 뒤 "선택 완료"를 눌러주세요.';
            panel.appendChild(hint);

            const actions = document.createElement('div');
            actions.className = 'dt-actions';
            const submit = document.createElement('button');
            submit.type = 'button';
            submit.className = 'dt-submit';
            submit.textContent = '선택 완료';
            submit.addEventListener('click', () => {
                if (submit.disabled) return;
                const parts = days
                    .filter(d => selected[d] && selected[d].size > 0)
                    .map(d => `${d} ${slots.filter(s => selected[d].has(s)).join('·')}`);
                if (parts.length === 0) {
                    showError('가능한 요일과 시간대를 하나 이상 선택해주세요');
                    return;
                }
                const input = document.getElementById('userInput');
                input.value = '운동 가능: ' + parts.join(', ');
                sendMessage();
            });
            actions.appendChild(submit);
            panel.appendChild(actions);

            container.appendChild(panel);
        }

        // Orchestrate an assistant turn: animate tool steps, then reveal text,
        // approval prompt, widget, and clickable choices.
        async function renderAssistant(data) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            chatArea.appendChild(messageDiv);

            const steps = Array.isArray(data.steps) ? data.steps : [];
            if (steps.length > 0) {
                const stepsWrap = document.createElement('div');
                stepsWrap.className = 'agent-steps';
                messageDiv.appendChild(stepsWrap);
                for (const step of steps) {
                    await animateStep(stepsWrap, step);
                }
            } else if (Array.isArray(data.agent_actions) && data.agent_actions.length) {
                messageDiv.insertAdjacentHTML('beforeend', renderAgentActions(data.agent_actions));
            }

            const text = (data.response || '').trim();
            if (text) {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = convertLinksToClickable(escapeHtml(text).replace(/\n/g, '<br>'));
                messageDiv.appendChild(contentDiv);
            }

            if (data.approval_prompt) {
                const ap = document.createElement('div');
                ap.className = 'approval-prompt';
                ap.textContent = data.approval_prompt;
                messageDiv.appendChild(ap);
            }

            if (data.widget && data.widget.type === 'day_time') {
                renderDayTimeWidget(messageDiv, data.widget);
            }

            renderChoices(messageDiv, getRenderableChoices(data));
            scrollToBottom();
        }

        function addMessage(role, content, isSystem = false, choices = [], agentActions = []) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSystem ? 'system' : role}`;

            let header = '';
            if (!isSystem && role === 'user') {
                header = 'You';
            }
            // Assistant 메시지는 header 없이 표시

            const actionsHtml = (!isSystem && role === 'assistant') ? renderAgentActions(agentActions) : '';

            // 개행을 <br>로 변환하고 URL을 클릭 가능한 링크로 변환
            const processedContent = convertLinksToClickable(content.replace(/\n/g, '<br>'));

            messageDiv.innerHTML = `
                ${header ? `<div class="message-header">${header}</div>` : ''}
                ${actionsHtml}
                <div class="message-content">${processedContent}</div>
            `;

            if (!isSystem && role === 'assistant') {
                renderChoices(messageDiv, choices);
            }
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function setLoading(isLoading) {
            const loading = document.getElementById('loading');
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            
            if (isLoading) {
                loading.classList.add('active');
                input.disabled = true;
                sendBtn.disabled = true;
            } else {
                loading.classList.remove('active');
                input.disabled = false;
                sendBtn.disabled = false;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }

        function getRenderableChoices(data) {
            return Array.isArray(data.choices) ? data.choices : [];
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) {
                showError('메시지를 입력해주세요');
                return;
            }

            disableAllChoiceButtons();
            
            addMessage('user', message);
            input.value = '';
            setLoading(true);
            
            try {
                const endpoint = conversationId ? '/api/chat' : '/api/start';
                const body = conversationId
                    ? { message: message }
                    : { query: message, group: assignedGroup };
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(body)
                });
                
                // 상태 코드 확인
                if (!response.ok) {
                    const errorText = await response.text();
                    showError(`Server error (${response.status}): ${errorText}`);
                    setLoading(false);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    setLoading(false);
                    return;
                }
                
                if (!conversationId) {
                    conversationId = data.conversation_id;
                }

                setLoading(false);
                await renderAssistant(data);

            } catch (error) {
                showError('Error: ' + error.message);
                setLoading(false);
            }
        }
        
        function startPlanning() {
            const input = document.getElementById('userInput');
            input.value = '앞으로 2주간 더 건강한 생활 루틴을 만들고 싶어요. 식단·운동·수면 계획을 짜줘';
            sendMessage();
        }

        async function resetChat() {
            try {
                await fetch('/api/reset', { method: 'POST' });
                location.reload();
            } catch (error) {
                showError('Error resetting: ' + error.message);
            }
        }
        
        // Allow Enter key to send message
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
